name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Create ZIP
              run: |
                  git archive \
                  --format=zip \
                  --output="pitch-playground-${GITHUB_REF_NAME}.zip" \
                  "${GITHUB_SHA}:sites"

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create \
                    "$GITHUB_REF_NAME" \
                    "pitch-playground-${GITHUB_REF_NAME}.zip" \
                    --generate-notes
