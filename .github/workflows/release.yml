name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Verify tag matches app version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  VERSION=$(node -p "require('./package.json').version")

                  if [ "$TAG" != "v$VERSION" ]; then
                      echo "Tag $TAG does not match app version $VERSION"
                      exit 1
                  fi

            - name: Create ZIP
              run: |
                  git archive \
                  --format=zip \
                  --output="pitch-playground-${GITHUB_REF_NAME}.zip" \
                  "HEAD:site"

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create \
                    "$GITHUB_REF_NAME" \
                    "pitch-playground-${GITHUB_REF_NAME}.zip" \
                    --generate-notes
